
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ماموستا</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:5px;background:#101116;color:#f5f1e7;
 font-family:Arial,sans-serif;text-align:center;
}
.panel{
 width:100%;padding:7px;border:1px solid #b99a53;
 border-radius:10px;background:#14151a;
}
.top{color:#d8b76a;font-size:10px;line-height:13px}
h1{font-size:19px;color:#e7c978;margin:2px 0}
h2{font-size:11px;margin:0 0 5px}
.counters{display:flex;gap:5px}
.counter{flex:1;min-width:0;border-radius:7px;padding:5px 2px}
.wins{background:#153d30}
.losses{background:#451f29}
h3{font-size:10px;margin:0 0 4px;white-space:nowrap}
.wins h3,.wins .number{color:#65e6a5}
.losses h3,.losses .number{color:#ff8c96}
.number{font-size:20px;font-weight:bold;margin:3px 0}
.buttons{display:flex;justify-content:center;gap:5px}
button{
 width:27px;height:25px;padding:0;border:0;border-radius:5px;
 font-size:18px;font-weight:bold;background:#f5f1e7;color:#171717;
}
</style>
</head>
<body>
<div class="panel">
 <div class="top">━━━━ 👑 ♛ 👑 ━━━━</div>
 <h1>ماموستا</h1>
 <h2>الأب الروحي</h2>
 <div class="top">━━━━━━━━━━</div>
 <div class="counters" style="margin-top:6px">
  <div class="counter wins">
   <h3>رابحة</h3>
   <div class="number" id="wins">0</div>
   <div class="buttons">
    <button onclick="change('wins',1)">+</button>
    <button onclick="change('wins',-1)">−</button>
   </div>
  </div>
  <div class="counter losses">
   <h3>خاسرة</h3>
   <div class="number" id="losses">0</div>
   <div class="buttons">
    <button onclick="change('losses',1)">+</button>
    <button onclick="change('losses',-1)">−</button>
   </div>
  </div>
 </div>
</div>
<script>
const counts={wins:0,losses:0};
function change(type,amount){
 counts[type]=Math.max(0,counts[type]+amount);
 document.getElementById(type).textContent=counts[type];
}
</script>
</body>
</html>
